spring:
  ai:
    openai:
      api-key: ${OPEN_AI_API_KEY}  # set this env var before running
      chat:
        options:
          model: gpt-4.1-mini
          max-tokens: 4096
  main:
    web-application-type: none

eval:
  dataset-size: 3          # how many Java functions to generate
  pass-threshold: 4.0       # score >= this = PASS
  output-file: eval-report.json